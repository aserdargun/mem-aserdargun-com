      <div lang="en">
        <h1>MEM — Agent Memory Laboratory</h1>
        <p>
          A deterministic laboratory for agent memory. The same candidate
          records are written, recalled, corrected, expired and deleted under
          three memory policies, so the difference between them stays visible.
        </p>
        <ul>
          <li>Six synthetic scenarios covering preferences, projects, conflicts, expiry, noise and untrusted scope.</li>
          <li>Three memory policies: session, simple and selective.</li>
          <li>Recall with source and version links back to every record.</li>
          <li>Correction, expiry, deletion and a memory inspector.</li>
          <li>Policy comparison and JSON export of the run.</li>
        </ul>
        <p>
          This interactive laboratory needs JavaScript. Every record is
          synthetic teaching data; nothing here describes a real person.
        </p>
